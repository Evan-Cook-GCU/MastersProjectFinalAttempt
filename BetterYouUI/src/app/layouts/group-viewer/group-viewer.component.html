<div class="page container-fluid"
*ngIf="membershipsLoaded&&loggedInUser&&!membership?.isBanned" >
    <h2 class="text-center">
    {{ group?.groupName }}
    <button 
      *ngIf="membershipsLoaded&&loggedInUser" 
      class="btn" 
      [ngClass]="{'btn-danger': isMember(loggedInUser), 'btn-success': !isMember(loggedInUser)}" 
      (click)="toggleMembership()">
      {{ isMember(loggedInUser) ? 'Quit Group' : 'Join Group' }}
    </button>
  </h2>
    <div class="row">
      <div class="col-md-3 my-2">
        <label for="groupMember">Select Group Member:</label>
        <select id="groupMember" (change)="onMemberChange($event)">
          <option *ngFor="let member of groupMembers" [value]="member.userId">{{ member.userName }}</option>
        </select>
        <div class="column" style="background-color: #c9bfdf !important; height: 100vh;">
          <app-metrics-list  [metrics]="metrics"></app-metrics-list>
        </div>
      </div>
      <div class="col-md-7 my-2">
        <div class="column" style="background-color: #e4f2ff !important; height: 100vh;">
          <mat-tab-group>
            <mat-tab  label="Graph">
              <mat-card>
                <mat-card-content>
                  <app-group-display [layout]="layout" [metrics]="metrics" [selectedUserId]="selectedUserId"></app-group-display>
                  <!-- <app-graph [metrics]="metrics" [selectedUserId]="selectedUserId"></app-graph> -->
                </mat-card-content>
              </mat-card>
            </mat-tab>
            <mat-tab *ngIf="membershipsLoaded&&isMember(loggedInUser)" label="MetricPopulator">
              <mat-card>
                <mat-card-content>
                   <app-metric-lister [metrics]="metrics" ></app-metric-lister> 
                </mat-card-content>
              </mat-card>
            </mat-tab>
            <mat-tab *ngIf="membership?.isAdmin" label="MetricBuilder">
              <mat-card>
                <mat-card-content>
                  <app-metric-builder [group]="group"></app-metric-builder>
                </mat-card-content>
              </mat-card>
            </mat-tab>
            <mat-tab *ngIf="membership?.isAdmin" label="Members">
              <mat-card>
                <mat-card-content>
                  <app-membership-management [group]="group"></app-membership-management>
                </mat-card-content>
              </mat-card>
            </mat-tab>
          </mat-tab-group>
        </div>
      </div>
      <div class="col-md-2 my-2 order-md-3">
        <div class="column" style="background-color: #c9bfdf !important;height:100vh;" *ngIf="membershipsLoaded&&loggedInUser&&!membership?.isBanned"><app-chat [group]="group"></app-chat></div>
    </div>
    </div>
  </div>
  <div *ngIf="membershipsLoaded&&membership?.isBanned" class="alert alert-danger" role="alert">
    You have been banned from this group.
  </div>
